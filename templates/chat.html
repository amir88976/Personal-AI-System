<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<title>Personal AI</title>
</head>

<body>

<h1>🤖 Personal AI</h1>

<input id="msg" placeholder="پیام خود را بنویس">
<button onclick="send()">ارسال</button>

<div id="chat"></div>

<script>
async function send(){

let msg = document.getElementById("msg").value;

let res = await fetch("/chat",{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:msg
})
});

let data = await res.json();

document.getElementById("chat").innerHTML +=
"<p>تو: "+msg+"</p>"+
"<p>AI: "+data.response+"</p>";

}

</script>

</body>
</html>

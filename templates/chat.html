<!DOCTYPE html>
<html>
<head>
    <title>Personal AI</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
        }

        #chat {
            width: 90%;
            max-width: 600px;
            margin: auto;
            background: #222;
            padding: 20px;
            border-radius: 10px;
            min-height: 300px;
        }

        input {
            width: 70%;
            padding: 10px;
        }

        button {
            padding: 10px;
        }
    </style>
</head>

<body>

<h1>Personal AI</h1>

<div id="chat"></div>

<br>

<input id="message" placeholder="پیام خود را بنویس">
<button onclick="send()">ارسال</button>


<script>

async function send(){

    let msg = document.getElementById("message").value;

    document.getElementById("chat").innerHTML +=
    "<p>تو: "+msg+"</p>";


    let response = await fetch("/chat",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify({
            message:msg
        })

    });


    let data = await response.json();


    document.getElementById("chat").innerHTML +=
    "<p>AI: "+data.response+"</p>";

}

</script>


</body>
</html>

<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <title>Personal AI</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
            padding: 30px;
        }

        input {
            width: 70%;
            padding: 15px;
            border-radius: 10px;
        }

        button {
            padding: 15px;
            border-radius: 10px;
            cursor: pointer;
        }

        #chat {
            margin-top: 30px;
            background: #222;
            padding: 20px;
            border-radius: 15px;
        }
    </style>

</head>


<body>

<h1>🤖 Personal AI</h1>


<input id="msg" placeholder="پیام خود را بنویس...">

<button onclick="send()">
ارسال
</button>


<div id="chat"></div>



<script>

async function send(){

let msg = document.getElementById("msg").value;


let res = await fetch(
"/chat",
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
message:msg
})
}
);


let data = await res.json();


document.getElementById("chat").innerHTML +=
"<p>تو: "+msg+"</p>"+
"<p>AI: "+data.response+"</p>";

}

</script>


</body>
</html>
